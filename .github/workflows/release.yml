name: Release

on:
  push:
    branches: [main]

concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      # act as the release app instead of the default GITHUB_TOKEN. pushes and merges made with
      # GITHUB_TOKEN don't trigger workflows, so CI wouldn't run on the version PR and merging it
      # wouldn't re-run this job to publish.
      - uses: actions/create-github-app-token@v2
        id: app-token
        with:
          app-id: ${{ vars.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
      - uses: actions/checkout@v5
        with:
          token: ${{ steps.app-token.outputs.token }}
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      # Opens a "Version Packages" PR while changesets are pending; once merged,
      # publishes any version not yet on npm.
      - uses: changesets/action@v1
        id: changesets
        with:
          publish: pnpm release
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
      # merge the version PR once CI passes, which publishes it
      - if: steps.changesets.outputs.pullRequestNumber
        run: gh pr merge --auto --squash "${{ steps.changesets.outputs.pullRequestNumber }}"
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}

  # Deploys the storybook to GitHub Pages on every push to main.
  storybook:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build-storybook
      - uses: actions/upload-pages-artifact@v4
        with:
          path: storybook-static
      - uses: actions/deploy-pages@v4
        id: deployment
